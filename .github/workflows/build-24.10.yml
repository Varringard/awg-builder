name: Build AmneziaWG for ImmortalWrt 24.10 (Kernel 6.6.95)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build AmneziaWG IPK (Filogic 24.10 / Kernel 6.6.95)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 \
            file tar zstd binutils

      - name: Download ImmortalWrt 24.10 Filogic SDK
        run: |
          wget -q --show-progress https://downloads.immortalwrt.org/releases/24.10.2/targets/mediatek/filogic/immortalwrt-sdk-24.10.2-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar --zstd -xf immortalwrt-sdk-*.tar.zst
          mv immortalwrt-sdk-* sdk
          rm -f *.tar.zst

      - name: Prepare Linux 6.6.95 WireGuard source
        run: |
          git clone --depth 1 --branch linux-6.6.y https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git /tmp/linux-wg
          cd /tmp/linux-wg
          mkdir -p /tmp/wireguard-src /tmp/wireguard-uapi
          cp drivers/net/wireguard/*.[ch] /tmp/wireguard-src/
          cp include/uapi/linux/wireguard.h /tmp/wireguard-uapi/
          ls -la /tmp/wireguard-src/

      - name: Configure SDK kernel environment for Cudy TR3000
        run: |
          cd sdk
          LINUX_DIR=$(find build_dir/ -maxdepth 3 -name "linux-6.6*" | head -n 1)
          if [ -n "$LINUX_DIR" ]; then
            echo "Found Linux dir: $LINUX_DIR"
            TARGET_DIR="${LINUX_DIR%/*}/linux-6.6.95"
            if [ "$LINUX_DIR" != "$TARGET_DIR" ]; then
              echo "Copying $LINUX_DIR to $TARGET_DIR..."
              cp -al "$LINUX_DIR" "$TARGET_DIR"
            fi
            LINUX_DIR="$TARGET_DIR"

            if [ -f "$LINUX_DIR/Makefile" ]; then
              sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 95/' "$LINUX_DIR/Makefile"
            fi
            find "$LINUX_DIR" -name "utsrelease.h" -exec sed -i 's/"6\.6\.[0-9]\+"/"6.6.95"/g' {} +
            find "$LINUX_DIR" -name "kernel.release" -exec sed -i 's/6\.6\.[0-9]\+/6.6.95/g' {} +
            echo "e4a482954d3a4492189ab1b470ab3d29" > "$LINUX_DIR/.vermagic"

            # Align struct module in include/linux/module.h directly for Cudy TR3000
            # Leaving autoconf.h untouched avoids breaking dependent kernel headers like kprobes.h
            MODULE_H="$LINUX_DIR/include/linux/module.h"
            if [ -f "$MODULE_H" ]; then
              echo "Patching $MODULE_H for Cudy TR3000 struct module layout..."
              export TARGET_MODULE_H="$MODULE_H"
              python3 - << 'PYEOF'
import os, sys

module_h = os.environ.get("TARGET_MODULE_H")
with open(module_h, "r") as f:
    content = f.read()

undefs = """
/* Begin Cudy TR3000 struct module alignment */
#undef CONFIG_MODULES_TREE_LOOKUP
#undef CONFIG_STACKTRACE_BUILD_ID
#undef CONFIG_ARCH_USES_CFI_TRAPS
#undef CONFIG_MODULE_SIG
#undef CONFIG_TRACEPOINTS
#undef CONFIG_BPF_EVENTS
#undef CONFIG_DEBUG_INFO_BTF_MODULES
#undef CONFIG_TRACING
#undef CONFIG_EVENT_TRACING
#undef CONFIG_FTRACE_MCOUNT_RECORD
#undef CONFIG_KPROBES
#undef CONFIG_HAVE_STATIC_CALL_INLINE
#undef CONFIG_KUNIT
#undef CONFIG_LIVEPATCH
#undef CONFIG_PRINTK_INDEX
#undef CONFIG_CONSTRUCTORS
#undef CONFIG_FUNCTION_ERROR_INJECTION
#undef CONFIG_DYNAMIC_DEBUG_CORE
/* End Cudy TR3000 struct module alignment */
"""

target = "struct module_memory {"
if target in content:
    content = content.replace(target, undefs + "\n" + target, 1)
    print("Inserted undefs before struct module_memory")
else:
    print("ERROR: struct module_memory not found in module.h!")
    sys.exit(1)

content = content.replace("#if IS_ENABLED(CONFIG_KUNIT)", "#if 0 /* IS_ENABLED(CONFIG_KUNIT) */")

with open(module_h, "w") as f:
    f.write(content)
print("module.h patched successfully.")
PYEOF
            fi
          fi

          if [ -f include/kernel-6.6 ]; then
            sed -i 's/LINUX_VERSION-6.6 = .*/LINUX_VERSION-6.6 = .95/' include/kernel-6.6
          fi

          find staging_dir/ -name ".vermagic" -exec sh -c 'echo "e4a482954d3a4492189ab1b470ab3d29" > "$1"' _ {} \; || true

          for d in $(find staging_dir/ -name "*linux-6.6.93*"); do
            newd=$(echo "$d" | sed 's/6\.6\.93/6.6.95/g')
            if [ -d "$d" ] && [ ! -e "$newd" ]; then
              ln -sf "$d" "$newd"
            fi
          done

      - name: Add AmneziaWG feed and prepare config
        run: |
          cd sdk
          echo "src-git amneziawg https://github.com/amnezia-vpn/amneziawg-openwrt.git" >> feeds.conf.default
          ./scripts/feeds update amneziawg luci
          ./scripts/feeds install luci-base
          ./scripts/feeds install -a -p amneziawg

          # Patch Makefile to use our prepared Linux 6.6.95 wireguard source
          sed -i 's|\$(LINUX_DIR)/drivers/net/wireguard/|/tmp/wireguard-src/|g' feeds/amneziawg/kmod-amneziawg/Makefile
          sed -i 's|\$(LINUX_DIR)/include/uapi/linux/wireguard.h|/tmp/wireguard-uapi/wireguard.h|g' feeds/amneziawg/kmod-amneziawg/Makefile

          make defconfig
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          make defconfig

      - name: Compile packages
        run: |
          cd sdk
          make package/kmod-amneziawg/compile V=s -j$(nproc)
          make package/amneziawg-tools/compile V=s -j$(nproc)

      - name: Inspect built IPK packages and struct module size
        run: |
          find sdk/bin/ -type f -name "*.ipk"
          for ipk in $(find sdk/bin/ -type f -name "kmod-amneziawg*.ipk"); do
            echo "Inspecting $ipk..."
            WORKDIR=$(mktemp -d)
            tar -xzf "$ipk" -C "$WORKDIR"
            tar -xzf "$WORKDIR/control.tar.gz" -C "$WORKDIR"
            echo "Package control file:"
            cat "$WORKDIR/control"

            tar -xzf "$WORKDIR/data.tar.gz" -C "$WORKDIR"
            KO=$(find "$WORKDIR" -name "amneziawg.ko")
            if [ -n "$KO" ]; then
              echo "Inspecting $KO:"
              strings "$KO" | grep "vermagic=" || true
              readelf -S "$KO" | grep -E "this_module|\.text" || true
            fi
            rm -rf "$WORKDIR"
          done

      - name: Prepare Release Artifacts
        run: |
          mkdir -p /tmp/release-pkgs
          find sdk/bin/ -type f -name "*amneziawg*.ipk" -exec cp {} /tmp/release-pkgs/ \;

          # Package luci-proto-amneziawg directly
          LUCI_DIR="sdk/feeds/amneziawg/luci-proto-amneziawg"
          if [ -d "$LUCI_DIR" ]; then
            echo "Packaging luci-proto-amneziawg..."
            WORKDIR=$(mktemp -d)
            mkdir -p "$WORKDIR/data/www" "$WORKDIR/data/usr" "$WORKDIR/control"
            cp -r "$LUCI_DIR/htdocs/"* "$WORKDIR/data/www/" || true
            cp -r "$LUCI_DIR/root/usr/"* "$WORKDIR/data/usr/" || true

            cat << 'EOF' > "$WORKDIR/control/control"
          Package: luci-proto-amneziawg
          Version: 0.0.1-1
          Depends: luci-base, amneziawg-tools, ucode
          Architecture: all
          Maintainer: Amnezia Admin <admin@amnezia.org>
          Section: luci
          Source: feeds/amneziawg/luci-proto-amneziawg
          Description: Provides Web UI for AmneziaWG
          EOF
            sed -i 's/^[[:space:]]\+//' "$WORKDIR/control/control"

            (cd "$WORKDIR/data" && tar --format=gnu --numeric-owner --sort=name -czf "$WORKDIR/data.tar.gz" .)
            (cd "$WORKDIR/control" && tar --format=gnu --numeric-owner --sort=name -czf "$WORKDIR/control.tar.gz" .)
            echo "2.0" > "$WORKDIR/debian-binary"

            (cd "$WORKDIR" && tar --format=gnu -czf /tmp/release-pkgs/luci-proto-amneziawg_0.0.1-1_all.ipk ./debian-binary ./control.tar.gz ./data.tar.gz)
            rm -rf "$WORKDIR"
          fi

          ls -la /tmp/release-pkgs/

      - name: Upload IPK packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-24.10-k6.6.95-ipk
          path: /tmp/release-pkgs/*.ipk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v24.10-k6.6.95
          name: AmneziaWG IPK for ImmortalWrt 24.10 (Cudy TR3000 / Kernel 6.6.95)
          files: /tmp/release-pkgs/*.ipk
          overwrite: true
          body: |
            Пакеты AmneziaWG (.ipk) для Cudy TR3000 под ImmortalWrt 24.10-SNAPSHOT (mediatek/filogic, aarch64_cortex-a53).
            Ядро: 6.6.95~e4a482954d3a4492189ab1b470ab3d29-r1 (размер struct module выровнен под ядро Cudy TR3000).

            Файлы:
            - `kmod-amneziawg_6.6.95.0.0.1-r1_aarch64_cortex-a53.ipk`
            - `amneziawg-tools_1.0.20240213-r1_aarch64_cortex-a53.ipk`
            - `luci-proto-amneziawg_0.0.1-1_all.ipk`

            ### Установка на роутер Cudy TR3000:
            1. Загрузите файлы на роутер в `/tmp`:
               ```bash
               scp *.ipk root@192.168.1.1:/tmp/
               ```
            2. Подключитесь по SSH и установите:
               ```bash
               opkg install /tmp/kmod-amneziawg*.ipk /tmp/amneziawg-tools*.ipk /tmp/luci-proto-amneziawg*.ipk
               ```